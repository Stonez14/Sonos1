name: Windows release

# Every push to main runs the tests. When version.py has a version that
# doesn't have a release yet, this also builds PC2Sonos-Setup.exe and
# publishes it as a GitHub Release. Installed copies see it on their next
# start and offer "Install update" on the dashboard.

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python test_logic.py

  release:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version and check for an existing release
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (python -c "from version import VERSION; print(VERSION)").Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "v$v is already released - bump version.py to publish a new one."
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.skip == 'false'
        with:
          python-version: "3.12"

      - name: Fetch the VB-CABLE driver pack (bundled unmodified, per VB-Audio's terms)
        if: steps.ver.outputs.skip == 'false'
        shell: pwsh
        run: |
          $dl = Join-Path $env:USERPROFILE "Downloads"
          New-Item -ItemType Directory -Force -Path $dl | Out-Null
          Invoke-WebRequest "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip" `
            -OutFile (Join-Path $dl "VBCABLE_Driver_Pack45.zip")

      - name: Build PC2Sonos-Setup.exe
        if: steps.ver.outputs.skip == 'false'
        shell: powershell
        run: |
          ./build_installer.ps1
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path PC2Sonos-Setup.exe)) { exit 1 }

      - name: Publish the release
        if: steps.ver.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $prev = git describe --tags --abbrev=0 2>$null
          if ($prev) { $log = git log --pretty="- %s" "$prev..HEAD" } else { $log = git log -10 --pretty="- %s" }
          ($log -join "`n") | Set-Content -Encoding utf8 notes.md
          gh release create "v$v" PC2Sonos-Setup.exe --title "PC2Sonos v$v" --notes-file notes.md
